<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2d3748;
        }
        .maintenance-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        .icon-wrapper {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
            color: #1a202c;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #4a5568;
            margin: 0 0 25px 0;
        }
        .resume-time {
            background: #ebf8ff;
            border: 2px solid #bee3f8;
            color: #2b6cb0;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            display: inline-block;
        }
        .highlight {
            color: #38a169;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-wrapper">⚙️</div>
        <h1>We'll be right back!</h1>
        <p>The hosting server is currently undergoing routine maintenance. <br><span class="highlight">There is no problem with your app!</span> Everything is safe and will be back online shortly.</p>
        <div class="resume-time">
            Auto-resuming after<br>11:59 PM on 17 November 2026
        </div>
    </div>
</body>
</html>
