<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cargo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1 class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
                        <rect x="8" y="10" width="20" height="20" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2" rx="2"/>
                        <path d="M 18 10 L 23 5 L 33 5 L 28 10 Z" fill="currentColor" opacity="0.6"/>
                        <path d="M 28 10 L 33 5 L 33 15 L 28 20 Z" fill="currentColor"/>
                    </svg>
                    Cargo
                </h1>
                <span class="admin-badge">Admin</span>
            </div>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle" title="Toggle theme">
                    <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <div class="user-menu">
                    <span id="userEmail" class="user-email"></span>
                    <button id="logoutBtn" class="btn btn-secondary btn-small">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Admin Container -->
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <a href="#overview" class="nav-item active" data-section="overview">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Overview
                </a>
                <a href="#users" class="nav-item" data-section="users">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    User Management
                </a>
                <a href="#audit" class="nav-item" data-section="audit">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="19" x2="12" y2="12"></line>
                        <line x1="9" y1="16" x2="15" y2="16"></line>
                    </svg>
                    Audit Log
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <!-- Overview Section -->
            <section id="overview" class="admin-section active">
                <div class="section-header">
                    <h2>Dashboard Overview</h2>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Users</div>
                        <div class="stat-value" id="statTotal">0</div>
                    </div>
                    <div class="stat-card pending">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" id="statPending">0</div>
                    </div>
                    <div class="stat-card approved">
                        <div class="stat-label">Approved</div>
                        <div class="stat-value" id="statApproved">0</div>
                    </div>
                    <div class="stat-card rejected">
                        <div class="stat-label">Rejected</div>
                        <div class="stat-value" id="statRejected">0</div>
                    </div>
                    <div class="stat-card revoked">
                        <div class="stat-label">Revoked</div>
                        <div class="stat-value" id="statRevoked">0</div>
                    </div>
                    <div class="stat-card suspended">
                        <div class="stat-label">Suspended</div>
                        <div class="stat-value" id="statSuspended">0</div>
                    </div>
                </div>
            </section>

            <!-- User Management Section -->
            <section id="users" class="admin-section">
                <div class="section-header">
                    <h2>User Management</h2>
                    <div class="section-controls">
                        <input type="text" id="searchUsers" placeholder="Search by email or name..." class="search-input">
                        <select id="filterStatus" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                            <option value="revoked">Revoked</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table id="usersTable" class="data-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="5" class="loading">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="usersPagination"></div>
            </section>

            <!-- Audit Log Section -->
            <section id="audit" class="admin-section">
                <div class="section-header">
                    <h2>Audit Log</h2>
                    <div class="section-controls">
                        <select id="filterAction" class="filter-select">
                            <option value="">All Actions</option>
                            <option value="created">Created</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                            <option value="revoked">Revoked</option>
                            <option value="restored">Restored</option>
                            <option value="suspended">Suspended</option>
                            <option value="logged_out">Logged Out</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table id="auditTable" class="data-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Action</th>
                                <th>Admin</th>
                                <th>Target User</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody">
                            <tr>
                                <td colspan="5" class="loading">Loading audit log...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="auditPagination"></div>
            </section>
        </main>
    </div>

    <!-- Action Modal -->
    <div id="actionModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Confirm Action</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
                <div id="modalInputs"></div>
            </div>
            <div class="modal-footer">
                <button id="modalCancel" class="btn btn-secondary">Cancel</button>
                <button id="modalConfirm" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
